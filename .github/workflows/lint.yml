name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  golangci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
      - name: golangci-lint (fake build)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --build-tags fake

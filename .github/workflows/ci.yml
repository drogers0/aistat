name: CI

on:
  push:
    branches: [main, v2-rewrite]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - name: go vet
        run: go vet ./...
      - name: go test
        run: |
          go test -race ./...
          go test -race -tags=fake ./...
      # install-go stays false so the action uses the pinned toolchain above:
      # its default installs whatever Go is "stable", which staticcheck lags behind.
      - name: staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          version: "2026.2.1"
          install-go: false
      - name: staticcheck (fake build)
        uses: dominikh/staticcheck-action@v1
        with:
          version: "2026.2.1"
          install-go: false
          build-tags: "fake"

# macOS notarization is not configured; macOS binaries will trigger Gatekeeper
# warnings on first run. Track as a follow-up.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version: '1.26.x', cache: true }
      # goreleaser builds with whatever go is on PATH, so setup-go above must
      # stay ahead of this step: it is what keeps darwin artifacts on the
      # LC_UUID-emitting toolchain (see go.mod and #38).
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A stable tag promoted onto an rc's commit would otherwise resolve
          # to the rc tag (git version sort ranks v2.5.0-rc.1 above v2.5.0).
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
